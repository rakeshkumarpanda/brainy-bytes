<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8ff; --surface:#fff; --ink:#0f2747; --ink2:#4d6383; --line:#d6e5f6; --accent:#2b7de9}
@media (prefers-color-scheme: dark){:root{--bg:#0a1424; --surface:#0f1d33; --ink:#e8f1fd; --ink2:#9db3d2; --line:#22395b; --accent:#62a6ff}}
body{margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family:Nunito,system-ui,sans-serif; text-align:center; padding:20px}
.em{font-size:84px; display:inline-block; animation:spin 3s ease-in-out infinite}
@keyframes spin{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg) translateY(-8px)}}
h1{font-family:"Baloo 2",Nunito,sans-serif; font-size:40px; margin:10px 0 4px}
p{color:var(--ink2); font-weight:700; max-width:460px; margin:0 auto 20px}
a{display:inline-block; padding:12px 20px; border-radius:14px; background:var(--accent); color:#fff; font-weight:800; text-decoration:none}
</style>
</head>
<body>
<div>
  <div class="em">🧭</div>
  <h1>This page wandered off</h1>
  <p>The link may be old or mistyped. Every lesson is still waiting for you on the home page.</p>
  <a id="home" href="./">🏠 Back to the home page</a>
</div>
<script>
// On GitHub Pages a project site lives under /<repo>/, so send people to that folder's home page.
const parts = location.pathname.split('/').filter(Boolean);
const home = document.getElementById('home');
home.href = '/';
if (parts.length) {
  fetch('/' + parts[0] + '/index.html', { method: 'HEAD' }).then(r => { if (r.ok) home.href = '/' + parts[0] + '/'; }).catch(() => {});
}
</script>
</body>
</html>
