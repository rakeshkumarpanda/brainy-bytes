<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Products · Brainy Shop</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main>
  <h1>Products</h1>
  <div class="row">
    <label style="display:flex;gap:8px;align-items:center">Search <input type="search" id="q" placeholder="Search products"></label>
    <label style="display:flex;gap:8px;align-items:center">Sort by <select id="sort"><option value="name">Name</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></label>
  </div>
  <p class="muted" id="loading">Loading products…</p>
  <ul class="cards" aria-label="Products"></ul>
  <p role="status" aria-live="polite"></p>
</main>
<script src="/app.js"></script>
<script>
let all = [];
const list = document.querySelector('.cards'), status = document.querySelector('[role=status]');
function draw() {
  const q = document.getElementById('q').value.toLowerCase(), s = document.getElementById('sort').value;
  const rows = all.filter(p => p.name.toLowerCase().includes(q)).sort((a, b) => s === 'low' ? a.price - b.price : s === 'high' ? b.price - a.price : a.name.localeCompare(b.name));
  list.innerHTML = rows.map(p => `<li class="card" data-testid="product-${p.id}">
      <h3>${p.name}</h3><span class="muted">${p.category}</span>
      <span class="price">${Shop.rupees(p.price)}</span>
      ${p.stock ? `<button type="button" data-id="${p.id}">Add to cart</button>` : '<button type="button" disabled>Out of stock</button>'}
    </li>`).join('') || '<li>No products match your search</li>';
}
list.addEventListener('click', async e => {
  const b = e.target.closest('button[data-id]');
  if (!b) return;
  if (!Shop.token()) { location.href = '/login'; return; }
  const r = await Shop.api('/api/cart', { method: 'POST', body: { productId: Number(b.dataset.id) } });
  status.textContent = r.ok ? `${all.find(p => p.id === Number(b.dataset.id)).name} added to your cart` : r.body.error;
  Shop.refreshCount();
});
document.getElementById('q').addEventListener('input', draw);
document.getElementById('sort').addEventListener('change', draw);
fetch('/api/products')
  .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
  .then(p => { all = p; document.getElementById('loading').remove(); draw(); })
  .catch(() => { const l = document.getElementById('loading'); l.textContent = 'Sorry, we could not load the products. Please try again.'; l.setAttribute('role', 'alert'); });
</script>
</body>
</html>
