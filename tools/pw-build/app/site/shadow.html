<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Reviews · Brainy Shop</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main>
  <h1>Reviews</h1>
  <review-card author="Asha" stars="5">The desk lamp is bright and quiet.</review-card>
  <review-card author="Ravi" stars="3">The mug is fine but a little small.</review-card>
</main>
<script src="/app.js"></script>
<script>
customElements.define('review-card', class extends HTMLElement {
  connectedCallback() {
    const root = this.attachShadow({ mode: 'open' });
    root.innerHTML = `<style>div{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:10px 0}</style>
      <div><b>${this.getAttribute('author')}</b> <span aria-label="${this.getAttribute('stars')} stars">${'⭐'.repeat(+this.getAttribute('stars'))}</span>
      <p><slot></slot></p><button type="button">Helpful</button> <span class="votes">0 people found this helpful</span></div>`;
    let n = 0;
    root.querySelector('button').onclick = () => { n++; root.querySelector('.votes').textContent = `${n} ${n === 1 ? 'person' : 'people'} found this helpful`; };
  }
});
</script>
</body>
</html>
