<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PayFast</title><link rel="stylesheet" href="/style.css"></head>
<body style="background:#fff;padding:12px">
  <form id="card" aria-label="Card details">
    <label>Card number <input name="card" inputmode="numeric" placeholder="1234 5678 9012 3456"></label>
    <label>Expiry <input name="exp" placeholder="MM/YY"></label>
    <button type="submit">Pay ₹219</button>
    <p role="alert"></p>
  </form>
<script>
document.getElementById('card').addEventListener('submit', e => {
  e.preventDefault();
  const n = e.target.card.value.replace(/\s/g, '');
  if (!/^\d{16}$/.test(n)) { e.target.querySelector('[role=alert]').textContent = 'Card number must have 16 digits'; return; }
  parent.postMessage({ paid: true, last4: n.slice(-4) }, '*');
  e.target.querySelector('[role=alert]').textContent = '';
});
</script>
</body>
</html>
